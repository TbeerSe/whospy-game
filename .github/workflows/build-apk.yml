name: build-apk

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Собрать веб-часть в apk-build/www
        run: |
          mkdir -p apk-build/www
          cp -r index.html manifest.webmanifest sw.js css src images apk-build/www/

      - name: Создать Android-проект (Capacitor)
        working-directory: apk-build
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init "Шпион" com.tbeerse.whospy --web-dir www
          npx cap add android
          npx cap sync android

      - name: Собрать debug APK
        working-directory: apk-build/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: whospy-apk
          path: apk-build/android/app/build/outputs/apk/debug/app-debug.apk
